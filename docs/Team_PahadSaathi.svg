<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">Team PahadSaathi — PahadSaathi AI prototype overview</title>
<desc id="desc">A one-page pitch poster showing the citizen disaster reporting workflow, implemented prototype features, technology stack, and future roadmap.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1f2a"/><stop offset="1" stop-color="#173d42"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3b85b"/><stop offset="1" stop-color="#f27e55"/></linearGradient>
  <style>
    .sans{font-family:Inter,Arial,sans-serif}.white{fill:#f7f5ef}.muted{fill:#c0d0cc}.gold{fill:#f3bd68}
    .h1{font-size:66px;font-weight:800;letter-spacing:-2px}.h2{font-size:28px;font-weight:700}.h3{font-size:21px;font-weight:700}
    .body{font-size:18px}.small{font-size:15px}.card{fill:#ffffff;fill-opacity:.075;stroke:#ffffff;stroke-opacity:.15;stroke-width:1.5}
    .num{font-size:22px;font-weight:800;fill:#142b30}.pill{fill:#f3bd68;fill-opacity:.16;stroke:#f3bd68;stroke-opacity:.55}
  </style>
</defs>
<rect width="1600" height="1100" fill="url(#bg)"/>
<circle cx="1450" cy="90" r="220" fill="#f3bd68" opacity=".06"/><circle cx="70" cy="1040" r="280" fill="#7fc5ad" opacity=".06"/>
<g class="sans">
  <text x="90" y="82" class="gold small" font-weight="700" letter-spacing="4">TEAM PAHADSAATHI  •  UTTARAKHAND</text>
  <text x="90" y="165" class="white h1">PahadSaathi <tspan class="gold">AI</tspan></text>
  <text x="94" y="215" class="muted" font-size="27">Disaster reporting and response coordination for the hills.</text>
  <rect x="90" y="250" width="1420" height="3" fill="url(#accent)"/>
  <text x="90" y="310" class="gold h2">THE CHALLENGE</text>
  <text x="90" y="350" class="white body">In remote, disaster-prone communities, reporting an incident with a clear location and actionable details can be difficult.</text>
  <text x="90" y="380" class="white body">Authorities also need a clearer way to review urgency, spot possible duplicates and understand village-level impact.</text>

  <text x="90" y="450" class="gold h2">HOW THE PROTOTYPE WORKS</text>
  <g transform="translate(90 480)">
    <rect width="330" height="150" rx="18" class="card"/>
    <circle cx="42" cy="42" r="22" fill="#f3bd68"/><text x="42" y="50" text-anchor="middle" class="num">1</text>
    <text x="78" y="49" class="white h3">Citizen reports</text>
    <text x="26" y="91" class="muted body">Select incident type, enter</text><text x="26" y="119" class="muted body">village and describe the event.</text>
    <path d="M340 75 H370 l-10 -9 m10 9 l-10 9" stroke="#f3bd68" stroke-width="3" fill="none"/>
    <g transform="translate(390)">
      <rect width="330" height="150" rx="18" class="card"/>
      <circle cx="42" cy="42" r="22" fill="#f3bd68"/><text x="42" y="50" text-anchor="middle" class="num">2</text>
      <text x="78" y="49" class="white h3">Location &amp; voice</text>
      <text x="26" y="91" class="muted body">Optional GPS, Hindi/English</text><text x="26" y="119" class="muted body">speech input and photo upload.</text>
      <path d="M340 75 H370 l-10 -9 m10 9 l-10 9" stroke="#f3bd68" stroke-width="3" fill="none"/>
    </g>
    <g transform="translate(780)">
      <rect width="330" height="150" rx="18" class="card"/>
      <circle cx="42" cy="42" r="22" fill="#f3bd68"/><text x="42" y="50" text-anchor="middle" class="num">3</text>
      <text x="78" y="49" class="white h3">Incident intelligence</text>
      <text x="26" y="91" class="muted body">Rule-based category and severity</text><text x="26" y="119" class="muted body">recommendations; duplicate flags.</text>
      <path d="M340 75 H370 l-10 -9 m10 9 l-10 9" stroke="#f3bd68" stroke-width="3" fill="none"/>
    </g>
    <g transform="translate(1170)">
      <rect width="250" height="150" rx="18" class="card"/>
      <circle cx="42" cy="42" r="22" fill="#f3bd68"/><text x="42" y="50" text-anchor="middle" class="num">4</text>
      <text x="78" y="49" class="white h3">Authority view</text>
      <text x="24" y="91" class="muted body">Dashboard, map, village</text><text x="24" y="119" class="muted body">summary and status updates.</text>
    </g>
  </g>

  <g transform="translate(90 690)">
    <rect width="690" height="275" rx="20" class="card"/>
    <text x="32" y="48" class="gold h2">IMPLEMENTED IN THE PROTOTYPE</text>
    <text x="32" y="92" class="white body">✓ Mobile-friendly citizen reporting</text>
    <text x="32" y="130" class="white body">✓ GPS capture and interactive incident map</text>
    <text x="32" y="168" class="white body">✓ Hindi and English browser voice input</text>
    <text x="32" y="206" class="white body">✓ Rule-based severity and duplicate recommendations</text>
    <text x="32" y="244" class="white body">✓ Authority dashboard and report status workflow</text>
  </g>
  <g transform="translate(810 690)">
    <rect width="700" height="275" rx="20" class="card"/>
    <text x="32" y="48" class="gold h2">TECHNOLOGY &amp; NEXT STEPS</text>
    <text x="32" y="90" class="white body">React • TypeScript • Python • FastAPI • SQLAlchemy • SQLite</text>
    <text x="32" y="124" class="white body">Leaflet • OpenStreetMap • Browser Web Speech API</text>
    <text x="32" y="172" class="muted body">Future: advanced NLP/LLM, offline sync, image analysis,</text>
    <text x="32" y="200" class="muted body">weather-data integration and secure government integration.</text>
    <rect x="32" y="220" width="410" height="34" rx="17" class="pill"/>
    <text x="50" y="243" class="gold small" font-weight="700">AI STATUS: RULE-BASED IN CURRENT PROTOTYPE</text>
  </g>
  <text x="90" y="1035" class="muted small">Proposed enhancement concept for Uttarakhand's citizen grievance and disaster-response ecosystem • Not officially integrated with CM Helpline 1905.</text>
  <text x="1510" y="1035" text-anchor="end" class="gold small" font-weight="700">TEAM PAHADSAATHI</text>
</g>
</svg>